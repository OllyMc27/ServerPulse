name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ServerPulse/ServerPulse.csproj
      - name: Build
        run: dotnet build ServerPulse/ServerPulse.csproj -c Release --no-restore
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ServerPulse
          path: ServerPulse/bin/Release/net10.0/ServerPulse.dll
