name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ServerPulse/ServerPulse.csproj
      - name: Build
        run: dotnet build ServerPulse/ServerPulse.csproj -c Release --no-restore
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ServerPulse/bin/Release/net10.0/ServerPulse.dll
